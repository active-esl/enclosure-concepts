# Deploy static gallery to GitHub Pages on AESL Proxmox CT101 runner.
# Runner name: esl-proxmox-runner — labels [self-hosted, Linux, X64, aesl, esl-proxmox]
# Do NOT use org gitrunner (ai-tools) or GitHub-hosted ubuntu-latest for this.
#
# Pages Settings (required once):
#   Settings → Pages → Build and deployment → Source = GitHub Actions
#   (API: build_type=workflow). That disables legacy branch /pages-build-deployment.
#   Do not set Source back to "Deploy from a branch" (main/) — that path queues/fails.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Match active-esl/lab-infra runner-smoke + etablone-cloud verify.
    # Explicit aesl pin; runner hostname is esl-proxmox-runner.
    runs-on: [self-hosted, Linux, X64, aesl, esl-proxmox]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare static publish tree
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # Publish repo root as the site; keep Actions metadata / VCS out of the artifact.
          # python3 shutil — rsync is not installed on esl-proxmox-runner.
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          src = Path(".")
          dst = Path("_site")
          ignore = {".git", ".github", "_site"}

          for child in src.iterdir():
              if child.name in ignore:
                  continue
              target = dst / child.name
              if child.is_dir():
                  shutil.copytree(
                      child,
                      target,
                      ignore=lambda d, names: [n for n in names if n in ignore],
                      dirs_exist_ok=True,
                  )
              else:
                  shutil.copy2(child, target)
          PY
          # Ensure GitHub never runs Jekyll on the artifact if settings regress.
          touch _site/.nojekyll
          echo "publish_bytes=$(du -sb _site | awk '{print $1}')"
          test -f _site/index.html
          test -f _site/handheld-eth/build.json
          python3 -c 'import json; print("handheld-eth build id:", json.load(open("_site/handheld-eth/build.json"))["id"])'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
