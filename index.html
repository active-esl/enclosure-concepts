<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Active-ESL — enclosure concepts</title>
  <style>
    :root {
      --bg: #0b1220; --card: #121a2b; --text: #f4f7fb; --muted: #a9b4c7; --accent: #3ec6ff; --warn: #ffcc66;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(1000px 600px at 80% 0%, #15233d 0%, var(--bg) 55%);
      padding: 32px 20px 48px;
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      background: rgba(255,204,102,.15); color: var(--warn);
      font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    }
    h1 { margin: 12px 0 8px; font-size: 1.8rem; }
    .lede { color: var(--muted); max-width: 42rem; line-height: 1.5; margin-bottom: 28px; }
    .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    a.card {
      display: block; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
      transition: transform .15s ease, border-color .15s ease;
    }
    a.card:hover { transform: translateY(-2px); border-color: rgba(62,198,255,.45); }
    a.card img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #0a0f18; }
    a.card .body { padding: 14px 16px 16px; }
    a.card h2 { margin: 0 0 6px; font-size: 1.1rem; }
    a.card p { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.4; }
    .cta { color: var(--accent); font-size: .9rem; margin-top: 10px; display: inline-block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Concept gallery</div>
    <h1>Active-ESL enclosure concepts</h1>
    <p class="lede">
      Interactive PLACEHOLDER ideas the team can open and rotate in the browser.
      Not measured production CAD until labelled otherwise.
    </p>
    <div class="grid">
      <a class="card" href="handheld/">
        <img src="handheld/beauty_raytrace_baseline.png" alt="Handheld concept still" />
        <div class="body">
          <h2>Handheld</h2>
          <p>~10″ tablet-class shell — thin bezel PLACEHOLDER for discussion with Michael / Gary / Adam.</p>
          <span class="cta">Open 3D viewer →</span>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
