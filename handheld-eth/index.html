<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Active-ESL handheld eth — PLACEHOLDER</title>
  <link rel="stylesheet" href="../site-nav.css?v=2" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script src="../look-viewer.js?v=1" defer></script>
  <style>
    :root {
      --bg: #0b1220; --panel: rgba(12, 18, 32, 0.78); --text: #f4f7fb; --muted: #a9b4c7; --accent: #3ec6ff; --warn: #ffcc66;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: radial-gradient(1200px 700px at 70% 10%, #15233d 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    model-viewer {
      width: 100%; height: 100%; background: transparent;
      touch-action: pan-y;
    }
    .hud {
      position: fixed; z-index: 2; left: 16px; right: 16px;
      top: calc(16px + var(--site-nav-h, 46px));
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between;
      pointer-events: none;
    }
    .card {
      pointer-events: auto; background: var(--panel); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.08); border-radius: 14px;
      padding: 14px 16px; max-width: min(520px, 100%);
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    .badge {
      display: inline-block; margin-bottom: 8px; padding: 3px 8px; border-radius: 999px;
      background: rgba(255,204,102,.15); color: var(--warn);
      font-size: .75rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
    }
    h1 { margin: 0 0 6px; font-size: 1.15rem; font-weight: 650; }
    p { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.45; }
    a { color: var(--accent); }
    .mode-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .mode-row a {
      display: inline-flex; align-items: center; min-height: 34px; padding: 6px 12px;
      border-radius: 999px; font-size: .85rem; font-weight: 650; text-decoration: none;
      border: 1px solid rgba(62,198,255,.35); background: rgba(62,198,255,.12);
    }
    .mode-row a.secondary {
      background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.14); color: var(--muted);
    }
    .hint {
      position: fixed; z-index: 2; left: 50%; bottom: 18px; transform: translateX(-50%);
      background: var(--panel); border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px; padding: 8px 14px; color: var(--muted); font-size: .85rem;
      pointer-events: none;
    }
    @media (max-width: 640px) {
      .hud { left: 10px; right: 10px; top: calc(10px + var(--site-nav-h, 84px)); }
      .card { padding: 10px 12px; max-width: 100%; }
      h1 { font-size: 1rem; }
      p.blurb {
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; font-size: .82rem;
      }
      p.blurb.expanded { display: block; -webkit-line-clamp: unset; overflow: visible; }
      .blurb-more {
        display: inline-block; margin-top: 4px; background: none; border: none;
        color: var(--accent); font-size: .8rem; font-weight: 650; padding: 0; cursor: pointer;
      }
      .hint { font-size: .75rem; bottom: 12px; max-width: calc(100% - 20px); text-align: center; }
    }
    @media (min-width: 641px) {
      .blurb-more { display: none; }
    }
  </style>
</head>
<body>
  <nav id="siteNav" class="site-nav" data-root="../" data-concept="eth" data-mode="look" aria-label="Concept site"></nav>
  <script src="../site-nav.js?v=2" defer></script>
  <div class="hud">
    <div class="card">
      <div class="badge">Placeholder · eth · Look</div>
      <h1>Handheld — eth (onboard RJ45)</h1>
      <p class="blurb" id="lookBlurb">
        Stepped rear · front / rear / hatch · irregular 2Db PCB.
        Beauty look — use the top bar for Inspect, Slim, or Gallery.
      </p>
      <button type="button" class="blurb-more" id="lookBlurbMore">More</button>
      <div class="mode-row">
        <a class="secondary" href="beauty_card.png" target="_blank" rel="noopener">Still</a>
      </div>
    </div>
  </div>

  <model-viewer
    src="handheld.glb?v=2"
    alt="Active-ESL handheld eth PLACEHOLDER enclosure with branded LCD"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="22deg"
    shadow-intensity="0.85"
    exposure="1.1"
    environment-image="neutral"
    interaction-prompt="auto"
  ></model-viewer>

  <div class="hint">Look · drag to rotate · pinch or Ctrl+scroll zoom · Inspect for teardown</div>
  <script>
    (() => {
      const blurb = document.getElementById('lookBlurb');
      const btn = document.getElementById('lookBlurbMore');
      if (!blurb || !btn) return;
      btn.addEventListener('click', () => {
        const open = blurb.classList.toggle('expanded');
        btn.textContent = open ? 'Less' : 'More';
      });
    })();
  </script>
</body>
</html>
