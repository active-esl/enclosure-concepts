<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Handheld eth — PLACEHOLDER</title>
  <style>
    :root {
      --bg: #0b1220; --panel: rgba(12, 18, 32, 0.94); --text: #f4f7fb;
      --muted: #a9b4c7; --accent: #3ec6ff; --warn: #ffcc66; --dim: #ffd166;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden;
      background: radial-gradient(1200px 700px at 70% 10%, #15233d 0%, var(--bg) 55%);
      color: var(--text); font-family: "Segoe UI", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%;
      display: block; touch-action: none; }
    #btnPanel {
      position: fixed; z-index: 4;
      top: calc(12px + var(--safe-top));
      left: calc(12px + var(--safe-left));
      min-width: 44px; min-height: 44px;
      padding: 10px 14px;
      background: rgba(12, 18, 32, 0.92); color: var(--accent);
      border: 1px solid rgba(62,198,255,.45); border-radius: 999px;
      font-size: .9rem; font-weight: 650; cursor: pointer;
      box-shadow: 0 8px 28px rgba(0,0,0,.4);
      -webkit-tap-highlight-color: transparent;
    }
    #btnPanel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .hud {
      position: fixed; z-index: 3;
      left: calc(12px + var(--safe-left));
      top: calc(64px + var(--safe-top));
      width: min(400px, calc(100% - 24px - var(--safe-left) - var(--safe-right)));
      max-height: calc(100% - 76px - var(--safe-top) - var(--safe-bottom));
      overflow: auto; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      transition: opacity .18s ease, transform .18s ease, visibility .18s;
    }
    body.panel-closed .hud {
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translateY(-8px);
    }
    .card { background: var(--panel); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.08); border-radius: 14px;
      padding: 14px 16px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
    .card-head { display: flex; gap: 10px; align-items: flex-start;
      justify-content: space-between; margin-bottom: 4px; }
    .card-head-main { min-width: 0; flex: 1; }
    #btnPanelClose {
      flex: 0 0 auto; min-width: 44px; min-height: 44px;
      padding: 8px 12px; margin: -6px -4px 0 0;
      background: rgba(255,255,255,.06); color: var(--muted);
      border: 1px solid rgba(255,255,255,.12); border-radius: 999px;
      font-size: .85rem; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .badge { display: inline-block; margin-bottom: 8px; padding: 3px 8px; border-radius: 999px;
      background: rgba(255,204,102,.15); color: var(--warn);
      font-size: .75rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
    h1 { margin: 0 0 6px; font-size: 1.1rem; font-weight: 650; }
    h2 { margin: 12px 0 6px; font-size: .78rem; font-weight: 650; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em; }
    p, .muted { margin: 0 0 10px; color: var(--muted); font-size: .88rem; line-height: 1.45; }
    a { color: var(--accent); }
    .toggles { display: grid; gap: 8px; margin: 6px 0 4px; }
    .toggles label { display: flex; gap: 10px; align-items: center; font-size: .95rem;
      cursor: pointer; min-height: 44px; padding: 2px 0;
      -webkit-tap-highlight-color: transparent; }
    .toggles input[type="checkbox"] { width: 20px; height: 20px; flex: 0 0 auto; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
    button {
      background: rgba(62,198,255,.15); color: var(--accent); border: 1px solid rgba(62,198,255,.35);
      border-radius: 999px; padding: 10px 14px; font-size: .9rem; cursor: pointer;
      min-height: 44px; -webkit-tap-highlight-color: transparent;
    }
    button.active { background: rgba(62,198,255,.35); }
    input[type="range"] { width: 100%; accent-color: var(--accent); height: 32px; }
    select {
      background: rgba(255,255,255,.06); color: var(--text); border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px; padding: 10px 12px; font-size: .9rem; min-height: 44px;
    }
    #measureOut, #feaOut { margin-top: 8px; font-size: .9rem; color: var(--text); min-height: 1.2em; }
    #dimList { margin-top: 6px; font-size: .82rem; color: var(--dim); line-height: 1.45; }
    .hint { position: fixed; z-index: 2; left: 50%;
      bottom: calc(14px + var(--safe-bottom)); transform: translateX(-50%);
      background: var(--panel); border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px; padding: 8px 14px; color: var(--muted); font-size: .8rem;
      pointer-events: none; max-width: calc(100% - 24px); text-align: center; }
    body.panel-closed .hint { opacity: .95; }
    .dim-label {
      color: #1a1408; background: rgba(255,209,102,.92); border: 1px solid rgba(255,209,102,.95);
      border-radius: 6px; padding: 2px 7px; font: 650 12px/1.3 "Segoe UI", system-ui, sans-serif;
      white-space: nowrap; pointer-events: none; user-select: none;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
    }
    .slider-row { display: grid; gap: 4px; margin: 6px 0; font-size: .85rem; color: var(--muted); }
    @media (max-width: 720px) {
      #btnPanel {
        top: auto; left: auto;
        right: calc(12px + var(--safe-right));
        bottom: calc(12px + var(--safe-bottom));
      }
      .hud {
        left: calc(8px + var(--safe-left));
        right: calc(8px + var(--safe-right));
        top: auto;
        bottom: calc(68px + var(--safe-bottom));
        width: auto;
        max-height: min(52vh, calc(100% - 90px - var(--safe-top) - var(--safe-bottom)));
      }
      body.panel-closed .hud { transform: translateY(12px); }
      .card { border-radius: 16px 16px 12px 12px; padding: 12px 14px 16px; }
      .hint { bottom: calc(68px + var(--safe-bottom)); font-size: .75rem; }
      body.panel-open .hint { opacity: 0; }
      h1 { font-size: 1rem; }
    }
  </style>
</head>

      return document.body.classList.contains('panel-open');
    }

      panelOpen = !!open;
      if (fromUser) panelUserSet = true;
      document.body.classList.toggle('panel-open', panelOpen);
      document.body.classList.toggle('panel-closed', !panelOpen);
      btnPanel.setAttribute('aria-expanded', panelOpen ? 'true' : 'false');
      btnPanel.textContent = panelOpen ? 'Hide panel' : 'Show panel';
      if (!skipHash) writeHash();
    }

    function defaultPanelOpen() {
      return !mqMobile.matches;
    }

    btnPanelClose.addEventListener('click', () => setPanelOpen(false, { fromUser: true }));

      if (!panelUserSet) setPanelOpen(defaultPanelOpen(), { fromUser: false });
    });

      lab.innerHTML = '<input type="checkbox" id="chkEdges" checked> Edge outline';
      featToggles.appendChild(lab);
    }
    if (FEATURES.explode) {
      document.getElementById('explodeBlock').hidden = false;
    }
    if (FEATURES.section) {
      document.getElementById('sectionBlock').hidden = false;
    }
    if (FEATURES.fea && FEA_OVERLAYS.length) {
      document.getElementById('feaBlock').hidden = false;
      const sel = document.getElementById('feaCase');
      for (const o of FEA_OVERLAYS) {
        const opt = document.createElement('option');
        opt.value = o.id;
        opt.textContent = o.label || o.id;
        sel.appendChild(opt);
      }
    }
    const dimToggles = document.getElementById('dimToggles');
    for (const g of DIM_GROUPS) {
      const lab = document.createElement('label');
      lab.innerHTML = `<input type="checkbox" data-dim="${g.id}"${g.default ? ' checked' : ''}> ${g.label}`;
      dimToggles.appendChild(lab);
    }
    if (!DIM_GROUPS.length) {
      document.getElementById('measHeading').style.display = 'none';
      document.getElementById('measOffRow').style.display = 'none';
    }
    const viewRow = document.getElementById('viewRow');
    for (const name of Object.keys(VIEW_DIRS)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.view = name;
      b.textContent = name[0].toUpperCase() + name.slice(1);
      viewRow.appendChild(b);
    }
    if (!FEATURES.measure) {
      document.getElementById('measureRow').style.display = 'none';
      document.getElementById('hint').textContent = 'Drag to orbit · scroll zoom';
    }

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    renderer.localClippingEnabled = true;

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.position = 'fixed';
    labelRenderer.domElement.style.inset = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    labelRenderer.domElement.style.zIndex = '1';
    document.body.appendChild(labelRenderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 2, 0.001, 20);
    camera.position.set(0.28, 0.22, 0.32);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.target.set(0.11, 0.075, 0.0);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 1.4;

    scene.add(new THREE.AmbientLight(0xffffff, 1.1));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(0.4, 0.6, 0.5);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 1.2);
    fill.position.set(-0.5, 0.3, -0.6);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 0.9);
    rim.position.set(0.0, -0.5, -0.3);
    scene.add(rim);

    const root = new THREE.Group();
    scene.add(root);
    const byName = {};
    const partRoots = {};
    const partBasePos = {};
    const dimRoot = new THREE.Group();
    scene.add(dimRoot);
    const dimByGroup = {};
    const markers = new THREE.Group();
    scene.add(markers);

    const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
    const clipPlanes = [clipPlane];
    let sectionOn = false;
    let modelReady = false;
    let suppressHash = false;
    let feaCache = {};
    let feaActive = null;

    const dimMat = new THREE.LineBasicMaterial({ color: 0xffd166 });
    const tickMat = new THREE.LineBasicMaterial({ color: 0xffd166 });

    function makeDim(dim) {
      const g = new THREE.Group();
      const a = new THREE.Vector3(...dim.a);
      const b = new THREE.Vector3(...dim.b);
      const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
      g.add(new THREE.Line(geo, dimMat));
      const dir = b.clone().sub(a);
      dir.normalize();
      let tick = new THREE.Vector3(0, 0, 1).cross(dir);
      if (tick.lengthSq() < 1e-6) tick = new THREE.Vector3(0, 1, 0).cross(dir);
      tick.normalize().multiplyScalar(0.003);
      for (const p of [a, b]) {
        const tgeo = new THREE.BufferGeometry().setFromPoints([
          p.clone().add(tick), p.clone().sub(tick),
        ]);
        g.add(new THREE.Line(tgeo, tickMat));
      }
      const mid = a.clone().add(b).multiplyScalar(0.5);
      const el = document.createElement('div');
      el.className = 'dim-label';
      el.textContent = dim.label;
      const label = new CSS2DObject(el);
      label.position.copy(mid);
      g.add(label);
      return g;
    }

    for (const group of DIM_GROUPS) {
      const wrap = new THREE.Group();
      wrap.visible = !!document.querySelector(`input[data-dim="${group.id}"]`)?.checked;
      for (const d of group.dims) wrap.add(makeDim(d));
      dimRoot.add(wrap);
      dimByGroup[group.id] = wrap;
    }

    function refreshDimList() {
      const lines = [];
      for (const group of DIM_GROUPS) {
        const on = document.querySelector(`input[data-dim="${group.id}"]`)?.checked;
        if (!on) continue;
        for (const d of group.dims) lines.push(d.label);
      }
      document.getElementById('dimList').textContent = lines.join(' · ');
    }
    function applyDims() {
      for (const group of DIM_GROUPS) {
        const on = !!document.querySelector(`input[data-dim="${group.id}"]`)?.checked;
        const wrap = dimByGroup[group.id];
        if (!wrap) continue;
        wrap.traverse((o) => { o.visible = on; });
      }
      refreshDimList();
      writeHash();
    }
    document.getElementById('dimToggles')?.addEventListener('change', applyDims);
    document.getElementById('btnDimsOff')?.addEventListener('click', () => {
      for (const i of document.querySelectorAll('input[data-dim]')) i.checked = false;
      applyDims();
    });

    // Screen-space outline: depth + normal second derivative (catches tangent blends).
    const depthSens = FEATURES.outline_depth_sensitivity ?? 320.0;
    const normalSens = FEATURES.outline_normal_sensitivity ?? 26.0;
    const OutlineShader = {
      uniforms: {
        tDiffuse: { value: null },
        tNormal: { value: null },
        tDepth: { value: null },
        resolution: { value: new THREE.Vector2(1, 1) },
        cameraNear: { value: 0.01 },
        cameraFar: { value: 10.0 },
        outlineColor: { value: new THREE.Color(0xe8eef7) },
        depthSensitivity: { value: depthSens },
        normalSensitivity: { value: normalSens },
        thickness: { value: 1.15 },
        enabled: { value: 0.0 },
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform sampler2D tNormal;
        uniform sampler2D tDepth;
        uniform vec2 resolution;
        uniform float cameraNear;
        uniform float cameraFar;
        uniform vec3 outlineColor;
        uniform float depthSensitivity;
        uniform float normalSensitivity;
        uniform float thickness;
        uniform float enabled;
        varying vec2 vUv;

        float linearDepth(vec2 uv) {
          float d = texture2D(tDepth, uv).x;
          float z = d * 2.0 - 1.0;
          return (2.0 * cameraNear * cameraFar) /
                 (cameraFar + cameraNear - z * (cameraFar - cameraNear));
        }

        vec3 readNormal(vec2 uv) {
          return texture2D(tNormal, uv).xyz * 2.0 - 1.0;
        }

        void main() {
          vec4 base = texture2D(tDiffuse, vUv);
          if (enabled < 0.5) { gl_FragColor = base; return; }

          vec2 texel = thickness / resolution;
          vec2 dx = vec2(texel.x, 0.0);
          vec2 dy = vec2(0.0, texel.y);

          float d0 = linearDepth(vUv);
          float dl = linearDepth(vUv - dx);
          float dr = linearDepth(vUv + dx);
          float dd = linearDepth(vUv - dy);
          float du = linearDepth(vUv + dy);
          float depthEdge = (abs((dl + dr) * 0.5 - d0) +
                             abs((dd + du) * 0.5 - d0)) / max(d0, 1e-5);

          vec3 n0 = readNormal(vUv);
          vec3 nl = readNormal(vUv - dx);
          vec3 nr = readNormal(vUv + dx);
          vec3 nd = readNormal(vUv - dy);
          vec3 nu = readNormal(vUv + dy);
          float normalEdge = length((nl + nr) * 0.5 - n0) +
                             length((nd + nu) * 0.5 - n0);

          float e = clamp(depthEdge * depthSensitivity +
                          normalEdge * normalSensitivity, 0.0, 1.0);
          e = smoothstep(0.16, 0.55, e);
          gl_FragColor = vec4(mix(base.rgb, outlineColor, e), base.a);
        }
      `,
    };

    const normalTarget = new THREE.WebGLRenderTarget(1, 1, {
      minFilter: THREE.NearestFilter,
      magFilter: THREE.NearestFilter,
    });
    normalTarget.depthTexture = new THREE.DepthTexture(1, 1);
    normalTarget.depthTexture.format = THREE.DepthFormat;
    normalTarget.depthTexture.type = THREE.FloatType;
    const normalMaterial = new THREE.MeshNormalMaterial();

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const outlinePass = new ShaderPass(OutlineShader);
    composer.addPass(outlinePass);
    composer.addPass(new OutputPass());

    let outlineOn = false;

    function renderNormalBuffer() {
      const dimWas = dimRoot.visible;
      const markWas = markers.visible;
      dimRoot.visible = false;
      markers.visible = false;
      scene.overrideMaterial = normalMaterial;
      renderer.setRenderTarget(normalTarget);
      renderer.clear();
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      scene.overrideMaterial = null;
      dimRoot.visible = dimWas;
      markers.visible = markWas;
    }

    function turbo(t) {
      // Approximate turbo colormap (0..1 → RGB 0..1)
      t = Math.min(1, Math.max(0, t));
      const r = Math.max(0, Math.min(1, 1.5 - Math.abs(4 * t - 3)));
      const g = Math.max(0, Math.min(1, 1.5 - Math.abs(4 * t - 2)));
      const b = Math.max(0, Math.min(1, 1.5 - Math.abs(4 * t - 1)));
      return new THREE.Color(r * 0.85 + 0.1, g * 0.9, b * 0.95);
    }

    function buildGrid(points, cell = 4.0) {
      const grid = new Map();
      for (const p of points) {
        const kx = Math.floor(p[0] / cell);
        const ky = Math.floor(p[1] / cell);
        const kz = Math.floor(p[2] / cell);
        const key = `${kx},${ky},${kz}`;
        if (!grid.has(key)) grid.set(key, []);
        grid.get(key).push(p);
      }
      return { grid, cell };
    }

    function nearestScalar(gridObj, x, y, z) {
      const { grid, cell } = gridObj;
      const cx = Math.floor(x / cell);
      const cy = Math.floor(y / cell);
      const cz = Math.floor(z / cell);
      let best = Infinity;
      let bestV = 0;
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          for (let dz = -1; dz <= 1; dz++) {
            const bucket = grid.get(`${cx + dx},${cy + dy},${cz + dz}`);
            if (!bucket) continue;
            for (const p of bucket) {
              const d = (p[0] - x) ** 2 + (p[1] - y) ** 2 + (p[2] - z) ** 2;
              if (d < best) { best = d; bestV = p[3]; }
            }
          }
        }
      }
      return best < Infinity ? bestV : null;
    }

    function clearFeaColors() {
      const partId = FEATURES.fea_part || 'rear';
      for (const mesh of (byName[partId] || [])) {
        const mat = mesh.material;
        if (!mat) continue;
        mat.vertexColors = false;
        if (mesh.userData.baseColor != null) mat.color.setHex(mesh.userData.baseColor);
        mat.needsUpdate = true;
        if (mesh.geometry.getAttribute('color')) {
          mesh.geometry.deleteAttribute('color');
        }
      }
      feaActive = null;
      document.getElementById('feaOut').textContent = '';
    }

    async function applyFea() {
      const on = !!document.getElementById('chkFea')?.checked;
      if (!on) {
        clearFeaColors();
        writeHash();
        return;
      }
      const caseId = document.getElementById('feaCase')?.value;
      const meta = FEA_OVERLAYS.find((o) => o.id === caseId);
      if (!meta) return;
      if (!feaCache[caseId]) {
        document.getElementById('feaOut').textContent = 'Loading FEA…';
        try {
          const res = await fetch(meta.url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          feaCache[caseId] = await res.json();
        } catch (err) {
          document.getElementById('feaOut').textContent = `FEA load failed: ${err.message}`;
          document.getElementById('chkFea').checked = false;
          writeHash();
          return;
        }
      }
      const data = feaCache[caseId];
      if (!document.getElementById('chkFea')?.checked ||
          document.getElementById('feaCase')?.value !== caseId) return;
      const partId = FEATURES.fea_part || 'rear';
      const meshes = byName[partId] || [];
      if (!meshes.length) {
        document.getElementById('feaOut').textContent = `No mesh for fea_part=${partId}`;
        return;
      }
      const off = FEATURES.fea_offset_mm || [0, 0, 0];
      const gridObj = buildGrid(data.points || []);
      const vmin = data.min ?? 0;
      const vmax = data.max ?? 1;
      const span = Math.max(1e-9, vmax - vmin);
      const explodedBy = partRoots[partId]?.position.clone()
        .sub(partBasePos[partId] || new THREE.Vector3()) || new THREE.Vector3();
      for (const mesh of meshes) {
        const pos = mesh.geometry.getAttribute('position');
        const colors = new Float32Array(pos.count * 3);
        mesh.updateMatrixWorld(true);
        const v = new THREE.Vector3();
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i);
          mesh.localToWorld(v);
          // Compare in the assembled frame even while this part is exploded.
          v.sub(explodedBy);
          // Scene is metres; FEA overlay is mm (+ optional frame offset).
          const sx = nearestScalar(
            gridObj,
            v.x * 1000 - off[0],
            v.y * 1000 - off[1],
            v.z * 1000 - off[2],
          );
          const t = sx == null ? 0 : (sx - vmin) / span;
          const c = turbo(t);
          colors[i * 3] = c.r;
          colors[i * 3 + 1] = c.g;
          colors[i * 3 + 2] = c.b;
        }
        mesh.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        mesh.material.vertexColors = true;
        mesh.material.color.setHex(0xffffff);
        mesh.material.needsUpdate = true;
      }
      feaActive = caseId;
      document.getElementById('feaOut').textContent =
        `${data.label || caseId}: ${data.field} ${vmin.toFixed(2)}–${vmax.toFixed(2)}` +
        (data.note ? ` · ${data.note}` : '');
      writeHash();
    }

    function applyExplode() {
      if (!FEATURES.explode || !modelReady) return;
      const t = (Number(document.getElementById('explodeRange')?.value) || 0) / 100;
      document.getElementById('explodePct').textContent = `${Math.round(t * 100)}%`;
      for (const id of PART_IDS) {
        const g = partRoots[id];
        if (!g) continue;
        const base = partBasePos[id] || new THREE.Vector3();
        const mm = Number(EXPLODE_OFFSETS[id] ?? 0);
        g.position.copy(base).addScaledVector(EXPLODE_AXIS, mm * 0.001 * t);
      }
      writeHash();
    }

    function worldBox() {
      root.updateMatrixWorld(true);
      return new THREE.Box3().setFromObject(root);
    }

    function applySection() {
      sectionOn = !!document.getElementById('chkSection')?.checked;
      const planeKey = document.getElementById('sectionPlane')?.value || 'xy';
      const t = (Number(document.getElementById('sectionRange')?.value) || 50) / 100;
      document.getElementById('sectionPct').textContent = `${Math.round(t * 100)}%`;
      if (!modelReady) {
        writeHash();
        return;
      }
      const box = worldBox();
      const min = box.min;
      const max = box.max;
      let normal, constant;
      if (planeKey === 'yz') {
        const x = min.x + (max.x - min.x) * t;
        normal = new THREE.Vector3(1, 0, 0);
        constant = -x;
      } else if (planeKey === 'xz') {
        const y = min.y + (max.y - min.y) * t;
        normal = new THREE.Vector3(0, 1, 0);
        constant = -y;
      } else {
        const z = min.z + (max.z - min.z) * t;
        normal = new THREE.Vector3(0, 0, 1);
        constant = -z;
      }
      clipPlane.normal.copy(normal);
      clipPlane.constant = constant;
      normalMaterial.clippingPlanes = sectionOn ? clipPlanes : [];
      normalMaterial.needsUpdate = true;
      root.traverse((o) => {
        if (!o.isMesh || !o.material) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) {
          m.clippingPlanes = sectionOn ? clipPlanes : [];
          m.clipShadows = sectionOn;
          m.needsUpdate = true;
        }
      });
      writeHash();
    }

    function parseHash() {
      if (!FEATURES.deeplink) return {};
      const h = location.hash.replace(/^#/, '');
      if (!h) return {};
      const out = {};
      for (const [key, value] of new URLSearchParams(h)) {
        if (key) out[key] = value;
      }
      return out;
    }

    function writeHash() {
      if (!FEATURES.deeplink || suppressHash || !modelReady) return;
      const q = [];
      q.push(`v=${encodeURIComponent(lastView)}`);
      const partsOn = PART_IDS.filter(
        (id) => document.querySelector(`input[data-part="${id}"]`)?.checked
      );
      q.push(`p=${encodeURIComponent(partsOn.join(','))}`);
      const dimsOn = DIM_GROUPS.map((g) => g.id).filter(
        (id) => document.querySelector(`input[data-dim="${id}"]`)?.checked
      );
      if (dimsOn.length) q.push(`d=${encodeURIComponent(dimsOn.join(','))}`);
      if (FEATURES.outline && document.getElementById('chkEdges')) {
        q.push(document.getElementById('chkEdges').checked ? 'o=1' : 'o=0');
      }
      if (FEATURES.explode) {
        const x = document.getElementById('explodeRange')?.value || '0';
        if (x !== '0') q.push(`x=${x}`);
      }
      if (FEATURES.section && document.getElementById('chkSection')?.checked) {
        const pl = document.getElementById('sectionPlane')?.value || 'xy';
        const sp = document.getElementById('sectionRange')?.value || '50';
        q.push(`s=${encodeURIComponent(pl + ':' + sp)}`);
      }
      if (FEATURES.fea && document.getElementById('chkFea')?.checked) {
        const f = document.getElementById('feaCase')?.value;
        if (f) q.push(`f=${encodeURIComponent(f)}`);
      }
      q.push(`ui=${isPanelOpen() ? '1' : '0'}`);
      const next = '#' + q.join('&');
      if (location.hash !== next) history.replaceState(null, '', next);
    }

    function applyHashState(state) {
      suppressHash = true;
      if (state.ui === '0' || state.ui === '1') {
        panelUserSet = true;
        setPanelOpen(state.ui === '1', { skipHash: true });
      }
      if (state.p != null) {
        const set = new Set(state.p.split(',').filter(Boolean));
        for (const id of PART_IDS) {
          const el = document.querySelector(`input[data-part="${id}"]`);
          if (el) el.checked = set.has(id);
        }
        applyVisibility();
      }
      if (state.d != null) {
        const set = new Set(state.d.split(',').filter(Boolean));
        for (const g of DIM_GROUPS) {
          const el = document.querySelector(`input[data-dim="${g.id}"]`);
          if (el) el.checked = set.has(g.id);
        }
      } else {
        for (const i of document.querySelectorAll('input[data-dim]')) i.checked = false;
      }
      applyDims();
      if (document.getElementById('chkEdges')) {
        // Default is on; only override when the hash explicitly sets o.
        if (state.o === '0' || state.o === '1') {
          document.getElementById('chkEdges').checked = state.o === '1';
        }
        applyEdges();
      }
      if (FEATURES.explode && state.x != null) {
        document.getElementById('explodeRange').value = state.x;
        applyExplode();
      }
      if (FEATURES.section && state.s) {
        const [pl, sp] = state.s.split(':');
        if (pl) document.getElementById('sectionPlane').value = pl;
        if (sp) document.getElementById('sectionRange').value = sp;
        document.getElementById('chkSection').checked = true;
        applySection();
      }
      if (FEATURES.fea && state.f && FEA_OVERLAYS.length) {
        document.getElementById('feaCase').value = state.f;
        document.getElementById('chkFea').checked = true;
        applyFea();
      }
      if (state.v) setView(state.v);
      suppressHash = false;
      writeHash();
    }

    const glbUrl = `${MANIFEST.glb}?v=${MANIFEST.glb_version || 1}`;
    const loader = new GLTFLoader();
    loader.load(glbUrl, (gltf) => {
      const model = gltf.scene;
      model.traverse((o) => {
        if (!o.isMesh) return;
        o.castShadow = true;
        o.receiveShadow = true;
        const n = (o.name || o.parent?.name || '').toLowerCase();
        let partId = null;
        for (const id of PART_IDS) {
          if (n === id || n.includes(id)) { partId = id; break; }
        }
        if (partId) {
          byName[partId] = byName[partId] || [];
          byName[partId].push(o);
        }
        const meta = PART_META[partId] || {};
        const col = PART_COLOR[partId] || 0x8e9298;
        const isGlass = !!meta.transparent || partId === 'glass';
        o.material = new THREE.MeshStandardMaterial({
          color: col,
          metalness: isGlass ? 0.1 : 0.35,
          roughness: isGlass ? 0.12 : 0.45,
          transparent: isGlass,
          opacity: isGlass ? (meta.opacity ?? 0.6) : 1.0,
          vertexColors: false,
          clippingPlanes: [],
        });
        o.userData.baseColor = col;
        o.userData.partId = partId;
      });
      const meshes = [];
      model.traverse((o) => { if (o.isMesh) meshes.push(o); });
      PART_IDS.forEach((id, i) => {
        if (!byName[id]?.length && meshes[i]) byName[id] = [meshes[i]];
      });

      // Put the source scene under root first so Group.attach preserves any
      // transforms from nested GLTF nodes while regrouping parts for explode.
      root.add(model);
      model.updateMatrixWorld(true);
      root.updateMatrixWorld(true);

      // One group per part so explode can translate without fighting GLTF hierarchy.
      for (const id of PART_IDS) {
        const g = new THREE.Group();
        g.name = `part_${id}`;
        root.add(g);
        for (const mesh of (byName[id] || [])) {
          g.attach(mesh);
        }
        partRoots[id] = g;
        partBasePos[id] = g.position.clone();
      }
      root.remove(model);

      applyVisibility();
      modelReady = true;

      const box = new THREE.Box3().setFromObject(root);
      fit.center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      fit.radius = size.length() / 2;
      fit.dim = Math.max(...size.toArray());
      camera.near = fit.dim / 100;
      camera.far = fit.dim * 20;

      const hashState = parseHash();
      if (Object.keys(hashState).length) {
        applyHashState(hashState);
      } else {
        setView('front');
        applyDims();
        applyExplode();
        applySection();
        writeHash();
      }
      document.getElementById('loading')?.remove();
    }, undefined, (err) => {
      document.getElementById('measureOut').textContent = 'Failed to load model: ' + err;
    });

    const fit = { center: new THREE.Vector3(), dim: 0.25, radius: 0.14 };
    let lastView = 'front';
    function setView(name) {
      lastView = name in VIEW_DIRS ? name : Object.keys(VIEW_DIRS)[0];
      const dir = new THREE.Vector3(...VIEW_DIRS[lastView]).normalize();
      const fovV = THREE.MathUtils.degToRad(camera.fov);
      const fovH = 2 * Math.atan(Math.tan(fovV / 2) * camera.aspect);
      const dist = Math.max(fit.radius / Math.tan(fovV / 2),
                            fit.radius / Math.tan(fovH / 2)) * 1.15;
      camera.position.copy(fit.center).addScaledVector(dir, dist);
      controls.target.copy(fit.center);
      camera.updateProjectionMatrix();
      controls.update();
      // Nudge framing clear of the left desktop panel when it is open.
      if (innerWidth > 900 && isPanelOpen()) {
        camera.updateMatrixWorld();
        const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
        right.multiplyScalar(-dist * Math.tan(fovH / 2) * 0.22);
        camera.position.add(right);
        controls.target.add(right);
        controls.update();
      }
      writeHash();
    }
    for (const b of document.querySelectorAll('button[data-view]')) {
      b.addEventListener('click', () => setView(b.dataset.view));
    }

    function applyVisibility() {
      for (const id of PART_IDS) {
        const on = document.querySelector(`input[data-part="${id}"]`)?.checked ?? true;
        const g = partRoots[id];
        if (g) g.visible = on;
        for (const o of (byName[id] || [])) o.visible = on;
      }
      writeHash();
    }
    document.getElementById('toggles').addEventListener('change', applyVisibility);

    function applyEdges() {
      outlineOn = !!document.getElementById('chkEdges')?.checked;
      outlinePass.uniforms.enabled.value = outlineOn ? 1.0 : 0.0;
      writeHash();
    }
    document.getElementById('chkEdges')?.addEventListener('change', applyEdges);
    applyEdges();

    document.getElementById('explodeRange')?.addEventListener('input', applyExplode);
    document.getElementById('chkSection')?.addEventListener('change', applySection);
    document.getElementById('sectionPlane')?.addEventListener('change', applySection);
    document.getElementById('sectionRange')?.addEventListener('input', applySection);
    document.getElementById('chkFea')?.addEventListener('change', () => applyFea());
    document.getElementById('feaCase')?.addEventListener('change', () => {
      if (document.getElementById('chkFea')?.checked) applyFea();
      else writeHash();
    });

    addEventListener('hashchange', () => {
      if (suppressHash) return;
      applyHashState(parseHash());
    });

    let measureOn = false;
    let pts = [];
    const lineMat = new THREE.LineBasicMaterial({ color: 0x3ec6ff });
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const btnM = document.getElementById('btnMeasure');
    const btnC = document.getElementById('btnClear');
    const out = document.getElementById('measureOut');
    const hint = document.getElementById('hint');

    if (FEATURES.measure) {
      btnM.onclick = () => {
        measureOn = !measureOn;
        btnM.classList.toggle('active', measureOn);
        controls.enabled = !measureOn;
        hint.textContent = measureOn
          ? 'Measure on — click point A, then point B'
          : 'Drag to orbit · scroll zoom · Measure: two clicks';
        if (!measureOn) clearMeasure();
      };
      btnC.onclick = () => clearMeasure();
    }

    function clearMeasure() {
      pts = [];
      while (markers.children.length) markers.remove(markers.children[0]);
      out.textContent = '';
    }

    function addMarker(p) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.0012, 16, 12),
        new THREE.MeshBasicMaterial({ color: 0x3ec6ff })
      );
      m.position.copy(p);
      markers.add(m);
    }

    canvas.addEventListener('pointerdown', (ev) => {
      if (!measureOn) return;
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hitTargets = [];
      root.traverse((o) => { if (o.isMesh && o.visible) hitTargets.push(o); });
      const hits = raycaster.intersectObjects(hitTargets, true);
      if (!hits.length) return;
      const p = hits[0].point.clone();
      if (pts.length >= 2) clearMeasure();
      pts.push(p);
      addMarker(p);
      if (pts.length === 2) {
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        markers.add(new THREE.Line(geo, lineMat));
        const mm = pts[0].distanceTo(pts[1]) * 1000;
        out.textContent = `Distance: ${mm.toFixed(2)} mm`;
        measureOn = false;
        btnM.classList.remove('active');
        controls.enabled = true;
        hint.textContent = 'Drag to orbit · scroll zoom · Measure: two clicks';
      } else {
        out.textContent = 'Point A set — click point B';
      }
    });

    function resize() {
      const w = Math.max(1, innerWidth);
      const h = Math.max(1, innerHeight);
      const dpr = renderer.getPixelRatio();
      renderer.setSize(w, h, false);
      labelRenderer.setSize(w, h);
      composer.setSize(w, h);
      normalTarget.setSize(Math.round(w * dpr), Math.round(h * dpr));
      outlinePass.uniforms.resolution.value.set(w * dpr, h * dpr);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    new ResizeObserver(resize).observe(document.body);
    resize();

    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      if (outlineOn) {
        outlinePass.uniforms.cameraNear.value = camera.near;
        outlinePass.uniforms.cameraFar.value = camera.far;
        renderNormalBuffer();
        outlinePass.uniforms.tNormal.value = normalTarget.texture;
        outlinePass.uniforms.tDepth.value = normalTarget.depthTexture;
      }
      composer.render();
      labelRenderer.render(scene, camera);
    })();
  </script>
</body>
</html>
