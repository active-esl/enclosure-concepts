<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Handheld eth — hideable + measure</title>
  <style>
    :root {
      --bg: #0b1220; --panel: rgba(12, 18, 32, 0.9); --text: #f4f7fb;
      --muted: #a9b4c7; --accent: #3ec6ff; --warn: #ffcc66;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden;
      background: radial-gradient(1200px 700px at 70% 10%, #15233d 0%, var(--bg) 55%);
      color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%;
      display: block; touch-action: none; }
    .hud { position: fixed; z-index: 2; left: 16px; top: 16px; max-width: min(380px, calc(100% - 32px)); }
    .card { background: var(--panel); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.08); border-radius: 14px;
      padding: 14px 16px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
    .badge { display: inline-block; margin-bottom: 8px; padding: 3px 8px; border-radius: 999px;
      background: rgba(255,204,102,.15); color: var(--warn);
      font-size: .75rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
    h1 { margin: 0 0 6px; font-size: 1.1rem; font-weight: 650; }
    p, .muted { margin: 0 0 10px; color: var(--muted); font-size: .88rem; line-height: 1.45; }
    a { color: var(--accent); }
    .toggles { display: grid; gap: 8px; margin: 10px 0; }
    .toggles label { display: flex; gap: 8px; align-items: center; font-size: .9rem; cursor: pointer; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    button {
      background: rgba(62,198,255,.15); color: var(--accent); border: 1px solid rgba(62,198,255,.35);
      border-radius: 999px; padding: 6px 12px; font-size: .85rem; cursor: pointer;
    }
    button.active { background: rgba(62,198,255,.35); }
    #measureOut { margin-top: 8px; font-size: .9rem; color: var(--text); min-height: 1.2em; }
    .hint { position: fixed; z-index: 2; left: 50%; bottom: 18px; transform: translateX(-50%);
      background: var(--panel); border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px; padding: 8px 14px; color: var(--muted); font-size: .85rem;
      pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="card">
      <div class="badge">Placeholder · hideable + measure</div>
      <h1>Handheld eth — hideable + measure</h1>
      <p>Toggle parts. Measure = click two points on the model (distance in mm). PLACEHOLDER — not measured CAD.</p>
      
      <div class="toggles" id="toggles">      <label><input type="checkbox" data-part="body" checked> Enclosure body</label>
      <label><input type="checkbox" data-part="hatch" checked> Service hatch cover</label>
      <label><input type="checkbox" data-part="glass" checked> LCD glass</label>
      <label><input type="checkbox" data-part="accents" checked> Accents (cam ring / home)</label>
      <label><input type="checkbox" data-part="pcb"> PCB ghost</label></div>
      <div class="row">
        <button type="button" data-view="front">Front</button>
        <button type="button" data-view="rear">Rear</button>
        <button type="button" data-view="side">Side</button>
        <button type="button" data-view="top">Top</button>
      </div>
      <div class="row">
        <button type="button" id="btnMeasure">Measure</button>
        <button type="button" id="btnClear">Clear measure</button>
      </div>
      <div id="measureOut"></div>
      <div id="loading" class="muted">Loading model…</div>
    </div>
  </div>
  <div class="hint" id="hint">Drag to orbit · scroll zoom · Measure: two clicks</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const PART_IDS = ["body", "hatch", "glass", "accents", "pcb"];
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 2, 0.001, 20);
    camera.position.set(0.28, 0.22, 0.32);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.target.set(0.11, 0.075, 0.0);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 1.4;

    scene.add(new THREE.AmbientLight(0xffffff, 1.1));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(0.4, 0.6, 0.5);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 1.2);
    fill.position.set(-0.5, 0.3, -0.6);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 0.9);
    rim.position.set(0.0, -0.5, -0.3);
    scene.add(rim);

    const root = new THREE.Group();
    scene.add(root);
    const byName = {};

    const loader = new GLTFLoader();
    loader.load('assembly.glb?v=2', (gltf) => {
      const model = gltf.scene;
      const PART_COLOR = {
        body: 0x919498, hatch: 0x484e58, glass: 0x1c2430,
        accents: 0xbec0c4, pcb: 0x1c6e37,
      };
      model.traverse((o) => {
        if (!o.isMesh) return;
        o.castShadow = true;
        o.receiveShadow = true;
        const n = (o.name || o.parent?.name || '').toLowerCase();
        let partId = null;
        for (const id of PART_IDS) {
          if (n === id || n.includes(id)) { partId = id; break; }
        }
        if (partId) {
          byName[partId] = byName[partId] || [];
          byName[partId].push(o);
        }
        const col = PART_COLOR[partId] || 0x8e9298;
        o.material = new THREE.MeshStandardMaterial({
          color: col,
          metalness: partId === 'glass' ? 0.1 : 0.35,
          roughness: partId === 'glass' ? 0.12 : 0.45,
          transparent: partId === 'glass',
          opacity: partId === 'glass' ? 0.6 : 1.0,
          vertexColors: false,
        });
      });
      // Fallback: order meshes if names missing
      const meshes = [];
      model.traverse((o) => { if (o.isMesh) meshes.push(o); });
      PART_IDS.forEach((id, i) => {
        if (!byName[id]?.length && meshes[i]) byName[id] = [meshes[i]];
      });
      root.add(model);
      applyVisibility();

      const box = new THREE.Box3().setFromObject(root);
      fit.center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      fit.radius = size.length() / 2;
      fit.dim = Math.max(...size.toArray());
      camera.near = fit.dim / 500;
      camera.far = fit.dim * 40;
      setView('front');
      document.getElementById('loading')?.remove();
    }, undefined, (err) => {
      document.getElementById('measureOut').textContent = 'Failed to load model: ' + err;
    });

    // Named views — Michael reviews the stepped rear, so make it one click.
    const fit = { center: new THREE.Vector3(), dim: 0.25, radius: 0.14 };
    const VIEW_DIRS = {
      front: [0.75, 0.5, 1.15],
      rear: [-0.75, 0.5, -1.15],
      side: [1.4, 0.25, 0.15],
      top: [0.15, 1.4, 0.6],
    };
    let lastView = 'front';
    function setView(name) {
      lastView = name in VIEW_DIRS ? name : 'front';
      const dir = new THREE.Vector3(...VIEW_DIRS[lastView]).normalize();
      const fovV = THREE.MathUtils.degToRad(camera.fov);
      const fovH = 2 * Math.atan(Math.tan(fovV / 2) * camera.aspect);
      const dist = Math.max(fit.radius / Math.tan(fovV / 2),
                            fit.radius / Math.tan(fovH / 2)) * 1.15;
      camera.position.copy(fit.center).addScaledVector(dir, dist);
      controls.target.copy(fit.center);
      camera.updateProjectionMatrix();
      controls.update();
      // Pan the subject clear of the HUD card on wide screens.
      if (innerWidth > 900) {
        camera.updateMatrixWorld();
        const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
        right.multiplyScalar(-dist * Math.tan(fovH / 2) * 0.22);
        camera.position.add(right);
        controls.target.add(right);
        controls.update();
      }
    }
    for (const b of document.querySelectorAll('button[data-view]')) {
      b.addEventListener('click', () => setView(b.dataset.view));
    }

    function applyVisibility() {
      for (const id of PART_IDS) {
        const on = document.querySelector(`input[data-part="${id}"]`)?.checked ?? true;
        for (const o of (byName[id] || [])) o.visible = on;
      }
    }
    document.getElementById('toggles').addEventListener('change', applyVisibility);

    // Measure (metres in scene → mm)
    let measureOn = false;
    let pts = [];
    const markers = new THREE.Group();
    scene.add(markers);
    const lineMat = new THREE.LineBasicMaterial({ color: 0x3ec6ff });
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const btnM = document.getElementById('btnMeasure');
    const btnC = document.getElementById('btnClear');
    const out = document.getElementById('measureOut');
    const hint = document.getElementById('hint');

    btnM.onclick = () => {
      measureOn = !measureOn;
      btnM.classList.toggle('active', measureOn);
      controls.enabled = !measureOn;
      hint.textContent = measureOn
        ? 'Measure on — click point A, then point B'
        : 'Drag to orbit · scroll zoom · Measure: two clicks';
      if (!measureOn) clearMeasure();
    };
    btnC.onclick = () => clearMeasure();

    function clearMeasure() {
      pts = [];
      while (markers.children.length) markers.remove(markers.children[0]);
      out.textContent = '';
    }

    function addMarker(p) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.0012, 16, 12),
        new THREE.MeshBasicMaterial({ color: 0x3ec6ff })
      );
      m.position.copy(p);
      markers.add(m);
    }

    canvas.addEventListener('pointerdown', (ev) => {
      if (!measureOn) return;
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hitTargets = [];
      root.traverse((o) => { if (o.isMesh && o.visible) hitTargets.push(o); });
      const hits = raycaster.intersectObjects(hitTargets, true);
      if (!hits.length) return;
      const p = hits[0].point.clone();
      if (pts.length >= 2) clearMeasure();
      pts.push(p);
      addMarker(p);
      if (pts.length === 2) {
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        markers.add(new THREE.Line(geo, lineMat));
        const mm = pts[0].distanceTo(pts[1]) * 1000;
        out.textContent = `Distance: ${mm.toFixed(2)} mm`;
        measureOn = false;
        btnM.classList.remove('active');
        controls.enabled = true;
        hint.textContent = 'Drag to orbit · scroll zoom · Measure: two clicks';
      } else {
        out.textContent = 'Point A set — click point B';
      }
    });

    function resize() {
      const w = Math.max(1, innerWidth);
      const h = Math.max(1, innerHeight);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    new ResizeObserver(resize).observe(document.body);
    resize();

    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
