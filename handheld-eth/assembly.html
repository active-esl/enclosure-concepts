<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Handheld eth — hideable + measure</title>
  <style>
    :root {
      --bg: #0b1220; --panel: rgba(12, 18, 32, 0.9); --text: #f4f7fb;
      --muted: #a9b4c7; --accent: #3ec6ff; --warn: #ffcc66; --dim: #ffd166;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden;
      background: radial-gradient(1200px 700px at 70% 10%, #15233d 0%, var(--bg) 55%);
      color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%;
      display: block; touch-action: none; }
    .hud { position: fixed; z-index: 2; left: 16px; top: 16px;
      max-width: min(400px, calc(100% - 32px)); max-height: calc(100% - 32px);
      overflow: auto; }
    .card { background: var(--panel); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.08); border-radius: 14px;
      padding: 14px 16px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
    .badge { display: inline-block; margin-bottom: 8px; padding: 3px 8px; border-radius: 999px;
      background: rgba(255,204,102,.15); color: var(--warn);
      font-size: .75rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
    h1 { margin: 0 0 6px; font-size: 1.1rem; font-weight: 650; }
    h2 { margin: 12px 0 6px; font-size: .78rem; font-weight: 650; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em; }
    p, .muted { margin: 0 0 10px; color: var(--muted); font-size: .88rem; line-height: 1.45; }
    a { color: var(--accent); }
    .toggles { display: grid; gap: 8px; margin: 6px 0 4px; }
    .toggles label { display: flex; gap: 8px; align-items: center; font-size: .9rem; cursor: pointer; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    button {
      background: rgba(62,198,255,.15); color: var(--accent); border: 1px solid rgba(62,198,255,.35);
      border-radius: 999px; padding: 6px 12px; font-size: .85rem; cursor: pointer;
    }
    button.active { background: rgba(62,198,255,.35); }
    #measureOut { margin-top: 8px; font-size: .9rem; color: var(--text); min-height: 1.2em; }
    #dimList { margin-top: 6px; font-size: .82rem; color: var(--dim); line-height: 1.45; }
    .hint { position: fixed; z-index: 2; left: 50%; bottom: 18px; transform: translateX(-50%);
      background: var(--panel); border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px; padding: 8px 14px; color: var(--muted); font-size: .85rem;
      pointer-events: none; }
    .dim-label {
      color: #1a1408; background: rgba(255,209,102,.92); border: 1px solid rgba(255,209,102,.95);
      border-radius: 6px; padding: 2px 7px; font: 650 12px/1.3 "Segoe UI", system-ui, sans-serif;
      white-space: nowrap; pointer-events: none; user-select: none;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="card">
      <div class="badge">Placeholder · hideable + measure</div>
      <h1>Handheld eth — hideable + measure</h1>
      <p>Toggle parts · view presets · show CAD dims · or Measure two clicks (mm). PLACEHOLDER — not measured CAD.</p>
      
      <h2>Parts</h2>
      <div class="toggles" id="toggles">      <label><input type="checkbox" data-part="body" checked> Enclosure body</label>
      <label><input type="checkbox" data-part="hatch" checked> Service hatch cover</label>
      <label><input type="checkbox" data-part="glass" checked> LCD glass</label>
      <label><input type="checkbox" data-part="accents" checked> Accents (cam ring / home)</label>
      <label><input type="checkbox" data-part="pcb"> PCB ghost</label></div>
      <div class="toggles">
        <label><input type="checkbox" id="chkEdges"> Edge outline</label>
      </div>
      <h2>Measurements</h2>
      <div class="toggles" id="dimToggles">      <label><input type="checkbox" data-dim="overall" checked> Overall body (W×H×D)</label>
      <label><input type="checkbox" data-dim="pad" checked> Rear pad (CAD)</label>
      <label><input type="checkbox" data-dim="hatch"> Service hatch</label>
      <label><input type="checkbox" data-dim="glass"> LCD glass</label>
      <label><input type="checkbox" data-dim="pcb"> PCB</label></div>
      <div id="dimList"></div>
      <div class="row">
        <button type="button" data-view="front">Front</button>
        <button type="button" data-view="rear">Rear</button>
        <button type="button" data-view="side">Side</button>
        <button type="button" data-view="top">Top</button>
      </div>
      <div class="row">
        <button type="button" id="btnMeasure">Measure</button>
        <button type="button" id="btnClear">Clear measure</button>
      </div>
      <div id="measureOut"></div>
      <div id="loading" class="muted">Loading model…</div>
    </div>
  </div>
  <div class="hint" id="hint">Drag to orbit · scroll zoom · Measure: two clicks</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const PART_IDS = ["body", "hatch", "glass", "accents", "pcb"];
    const DIM_GROUPS = [{"id": "overall", "label": "Overall body (W\u00d7H\u00d7D)", "default": true, "dims": [{"label": "W 222.9 mm", "mm": 222.9, "a": [-0.00045000000000000004, 0.158, 0.008], "b": [0.22244999999999998, 0.158, 0.008]}, {"label": "H 150.0 mm", "mm": 150.0, "a": [0.23045, 0.0, 0.008], "b": [0.23045, 0.15, 0.008]}, {"label": "D 21.5 mm", "mm": 21.5, "a": [0.23045, 0.15, -0.0135], "b": [0.23045, 0.15, 0.008]}]}, {"id": "pad", "label": "Rear pad (CAD)", "default": true, "dims": [{"label": "pad W 156.0 mm", "mm": 155.99, "a": [0.03300499999999999, 0.008000000000000007, 0.0], "b": [0.188995, 0.008000000000000007, 0.0]}, {"label": "pad H 117.3 mm", "mm": 117.3, "a": [0.025004999999999996, 0.016000000000000007, 0.0], "b": [0.025004999999999996, 0.1333, 0.0]}, {"label": "raise 13.5 mm", "mm": 13.5, "a": [0.025004999999999996, 0.1333, -0.0135], "b": [0.025004999999999996, 0.1333, 0.0]}, {"label": "thin edge 8.0 mm", "mm": 8.0, "a": [0.23045, 0.01, 0.0], "b": [0.23045, 0.01, 0.008]}]}, {"id": "hatch", "label": "Service hatch", "default": false, "dims": [{"label": "hatch W 100.0 mm", "mm": 100.0, "a": [0.061, 0.076, -0.01202], "b": [0.161, 0.076, -0.01202]}, {"label": "hatch D 46.0 mm", "mm": 46.0, "a": [0.169, 0.022, -0.01202], "b": [0.169, 0.068, -0.01202]}]}, {"id": "glass", "label": "LCD glass", "default": false, "dims": [{"label": "glass W 216.0 mm", "mm": 216.0, "a": [0.003, 0.146, 0.00795], "b": [0.219, 0.146, 0.00795]}, {"label": "glass H 135.0 mm", "mm": 135.0, "a": [0.227, 0.003, 0.00795], "b": [0.227, 0.138, 0.00795]}]}, {"id": "pcb", "label": "PCB", "default": false, "dims": [{"label": "PCB W 146.0 mm", "mm": 145.99, "a": [0.038005000000000004, 0.13215000000000002, 0.005200000000000001], "b": [0.18399500000000002, 0.13215000000000002, 0.005200000000000001]}, {"label": "PCB H 98.3 mm", "mm": 98.3, "a": [0.191995, 0.02585, 0.005200000000000001], "b": [0.191995, 0.12415000000000001, 0.005200000000000001]}]}];
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.position = 'fixed';
    labelRenderer.domElement.style.inset = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    labelRenderer.domElement.style.zIndex = '1';
    document.body.appendChild(labelRenderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 2, 0.001, 20);
    camera.position.set(0.28, 0.22, 0.32);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.target.set(0.11, 0.075, 0.0);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 1.4;

    scene.add(new THREE.AmbientLight(0xffffff, 1.1));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(0.4, 0.6, 0.5);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 1.2);
    fill.position.set(-0.5, 0.3, -0.6);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 0.9);
    rim.position.set(0.0, -0.5, -0.3);
    scene.add(rim);

    const root = new THREE.Group();
    scene.add(root);
    const byName = {};
    const edgeLines = [];
    const edgeMat = new THREE.LineBasicMaterial({
      color: 0xd7dde8, transparent: true, opacity: 0.92,
    });
    const dimRoot = new THREE.Group();
    scene.add(dimRoot);
    const dimByGroup = {};

    const dimMat = new THREE.LineBasicMaterial({ color: 0xffd166 });
    const tickMat = new THREE.LineBasicMaterial({ color: 0xffd166 });

    function makeDim(dim) {
      const g = new THREE.Group();
      const a = new THREE.Vector3(...dim.a);
      const b = new THREE.Vector3(...dim.b);
      const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
      g.add(new THREE.Line(geo, dimMat));
      // end ticks perpendicular to the dim axis (screen-ish size)
      const dir = b.clone().sub(a);
      const len = dir.length() || 1;
      dir.normalize();
      let tick = new THREE.Vector3(0, 0, 1).cross(dir);
      if (tick.lengthSq() < 1e-6) tick = new THREE.Vector3(0, 1, 0).cross(dir);
      tick.normalize().multiplyScalar(0.003);
      for (const p of [a, b]) {
        const tgeo = new THREE.BufferGeometry().setFromPoints([
          p.clone().add(tick), p.clone().sub(tick),
        ]);
        g.add(new THREE.Line(tgeo, tickMat));
      }
      const mid = a.clone().add(b).multiplyScalar(0.5);
      const el = document.createElement('div');
      el.className = 'dim-label';
      el.textContent = dim.label;
      const label = new CSS2DObject(el);
      label.position.copy(mid);
      g.add(label);
      return g;
    }

    for (const group of DIM_GROUPS) {
      const wrap = new THREE.Group();
      wrap.visible = !!document.querySelector(`input[data-dim="${group.id}"]`)?.checked;
      for (const d of group.dims) wrap.add(makeDim(d));
      dimRoot.add(wrap);
      dimByGroup[group.id] = wrap;
    }

    function refreshDimList() {
      const lines = [];
      for (const group of DIM_GROUPS) {
        const on = document.querySelector(`input[data-dim="${group.id}"]`)?.checked;
        if (!on) continue;
        for (const d of group.dims) lines.push(d.label);
      }
      document.getElementById('dimList').textContent = lines.join(' · ');
    }
    function applyDims() {
      for (const group of DIM_GROUPS) {
        const on = !!document.querySelector(`input[data-dim="${group.id}"]`)?.checked;
        const wrap = dimByGroup[group.id];
        if (!wrap) continue;
        // CSS2DRenderer only checks each object's own .visible, not ancestors.
        wrap.traverse((o) => { o.visible = on; });
      }
      refreshDimList();
    }
    document.getElementById('dimToggles')?.addEventListener('change', applyDims);
    applyDims();

    const loader = new GLTFLoader();
    loader.load('assembly.glb?v=3', (gltf) => {
      const model = gltf.scene;
      const PART_COLOR = {
        body: 0x919498, hatch: 0x484e58, glass: 0x1c2430,
        accents: 0xbec0c4, pcb: 0x1c6e37,
      };
      model.traverse((o) => {
        if (!o.isMesh) return;
        o.castShadow = true;
        o.receiveShadow = true;
        const n = (o.name || o.parent?.name || '').toLowerCase();
        let partId = null;
        for (const id of PART_IDS) {
          if (n === id || n.includes(id)) { partId = id; break; }
        }
        if (partId) {
          byName[partId] = byName[partId] || [];
          byName[partId].push(o);
        }
        const col = PART_COLOR[partId] || 0x8e9298;
        o.material = new THREE.MeshStandardMaterial({
          color: col,
          metalness: partId === 'glass' ? 0.1 : 0.35,
          roughness: partId === 'glass' ? 0.12 : 0.45,
          transparent: partId === 'glass',
          opacity: partId === 'glass' ? 0.6 : 1.0,
          vertexColors: false,
        });
        // Feature edges (threshold skips soft triangulation noise)
        const eg = new THREE.EdgesGeometry(o.geometry, 28);
        const lines = new THREE.LineSegments(eg, edgeMat);
        lines.renderOrder = 2;
        lines.visible = false;
        lines.userData.isEdge = true;
        o.add(lines);
        edgeLines.push(lines);
      });
      const meshes = [];
      model.traverse((o) => { if (o.isMesh) meshes.push(o); });
      PART_IDS.forEach((id, i) => {
        if (!byName[id]?.length && meshes[i]) byName[id] = [meshes[i]];
      });
      root.add(model);
      applyVisibility();

      const box = new THREE.Box3().setFromObject(root);
      fit.center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      fit.radius = size.length() / 2;
      fit.dim = Math.max(...size.toArray());
      camera.near = fit.dim / 500;
      camera.far = fit.dim * 40;
      setView('front');
      document.getElementById('loading')?.remove();
    }, undefined, (err) => {
      document.getElementById('measureOut').textContent = 'Failed to load model: ' + err;
    });

    const fit = { center: new THREE.Vector3(), dim: 0.25, radius: 0.14 };
    const VIEW_DIRS = {
      front: [0.75, 0.5, 1.15],
      rear: [-0.75, 0.5, -1.15],
      side: [1.4, 0.25, 0.15],
      top: [0.15, 1.4, 0.6],
    };
    let lastView = 'front';
    function setView(name) {
      lastView = name in VIEW_DIRS ? name : 'front';
      const dir = new THREE.Vector3(...VIEW_DIRS[lastView]).normalize();
      const fovV = THREE.MathUtils.degToRad(camera.fov);
      const fovH = 2 * Math.atan(Math.tan(fovV / 2) * camera.aspect);
      const dist = Math.max(fit.radius / Math.tan(fovV / 2),
                            fit.radius / Math.tan(fovH / 2)) * 1.15;
      camera.position.copy(fit.center).addScaledVector(dir, dist);
      controls.target.copy(fit.center);
      camera.updateProjectionMatrix();
      controls.update();
      if (innerWidth > 900) {
        camera.updateMatrixWorld();
        const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
        right.multiplyScalar(-dist * Math.tan(fovH / 2) * 0.22);
        camera.position.add(right);
        controls.target.add(right);
        controls.update();
      }
    }
    for (const b of document.querySelectorAll('button[data-view]')) {
      b.addEventListener('click', () => setView(b.dataset.view));
    }

    function applyVisibility() {
      for (const id of PART_IDS) {
        const on = document.querySelector(`input[data-part="${id}"]`)?.checked ?? true;
        for (const o of (byName[id] || [])) o.visible = on;
      }
    }
    document.getElementById('toggles').addEventListener('change', applyVisibility);

    function applyEdges() {
      const on = !!document.getElementById('chkEdges')?.checked;
      for (const e of edgeLines) e.visible = on;
    }
    document.getElementById('chkEdges')?.addEventListener('change', applyEdges);

    let measureOn = false;
    let pts = [];
    const markers = new THREE.Group();
    scene.add(markers);
    const lineMat = new THREE.LineBasicMaterial({ color: 0x3ec6ff });
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const btnM = document.getElementById('btnMeasure');
    const btnC = document.getElementById('btnClear');
    const out = document.getElementById('measureOut');
    const hint = document.getElementById('hint');

    btnM.onclick = () => {
      measureOn = !measureOn;
      btnM.classList.toggle('active', measureOn);
      controls.enabled = !measureOn;
      hint.textContent = measureOn
        ? 'Measure on — click point A, then point B'
        : 'Drag to orbit · scroll zoom · Measure: two clicks';
      if (!measureOn) clearMeasure();
    };
    btnC.onclick = () => clearMeasure();

    function clearMeasure() {
      pts = [];
      while (markers.children.length) markers.remove(markers.children[0]);
      out.textContent = '';
    }

    function addMarker(p) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.0012, 16, 12),
        new THREE.MeshBasicMaterial({ color: 0x3ec6ff })
      );
      m.position.copy(p);
      markers.add(m);
    }

    canvas.addEventListener('pointerdown', (ev) => {
      if (!measureOn) return;
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hitTargets = [];
      root.traverse((o) => { if (o.isMesh && o.visible) hitTargets.push(o); });
      const hits = raycaster.intersectObjects(hitTargets, true);
      if (!hits.length) return;
      const p = hits[0].point.clone();
      if (pts.length >= 2) clearMeasure();
      pts.push(p);
      addMarker(p);
      if (pts.length === 2) {
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        markers.add(new THREE.Line(geo, lineMat));
        const mm = pts[0].distanceTo(pts[1]) * 1000;
        out.textContent = `Distance: ${mm.toFixed(2)} mm`;
        measureOn = false;
        btnM.classList.remove('active');
        controls.enabled = true;
        hint.textContent = 'Drag to orbit · scroll zoom · Measure: two clicks';
      } else {
        out.textContent = 'Point A set — click point B';
      }
    });

    function resize() {
      const w = Math.max(1, innerWidth);
      const h = Math.max(1, innerHeight);
      renderer.setSize(w, h, false);
      labelRenderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    new ResizeObserver(resize).observe(document.body);
    resize();

    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    })();
  </script>
</body>
</html>
